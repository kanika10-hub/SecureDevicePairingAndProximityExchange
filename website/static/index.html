<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Device Pairing — Live Crypto Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-title">
      <span class="header-lock">🔐</span>
      <div>
        <h1>Secure Device Pairing</h1>
        <p class="header-sub">Live visualizer — X25519 + ML-KEM-768 + HKDF + ASCON-128a</p>
      </div>
    </div>
    <div class="controls">
      <div class="scenario-row">
        <button id="btn-pair" class="btn btn-primary" disabled>Pair Fresh</button>
        <button id="btn-reconnect" class="btn btn-secondary" disabled title="Run proximity reconnect after pairing">🔄 Reconnect</button>
        <button id="btn-stranger" class="btn btn-danger" disabled title="Demo a stranger being rejected">👾 Stranger Attack</button>
      </div>
      <div class="msg-row">
        <input id="msg-input" class="msg-input" type="text"
               placeholder="Type a message to encrypt…" disabled>
        <button id="btn-send" class="btn btn-accent" disabled>Send Encrypted</button>
      </div>
    </div>
  </header>

  <main class="panels">

    <!-- Device A -->
    <section class="panel" id="panel-a">
      <div class="panel-header">
        <div class="panel-header-left">
          <div class="device-badge badge-a" id="badge-a">Device A</div>
          <select class="device-select"
                  onchange="updateDeviceLabel('a', this.options[this.selectedIndex].text)">
            <option>💻 Laptop</option>
            <option>📱 Phone</option>
            <option>📊 Tablet</option>
            <option>⌚ Watch</option>
          </select>
        </div>
        <div class="panel-status" id="status-a">Connecting…</div>
      </div>

      <div class="qr-area" id="qr-area">
        <div class="qr-placeholder">
          <div class="qr-spinner"></div>
          <span>Generating QR…</span>
        </div>
      </div>

      <div class="feed" id="feed-a"></div>
    </section>

    <!-- Centre divider / wire -->
    <div class="wire-col">
      <div class="wire-label">network</div>
      <div class="wire"></div>
      <div class="wire-label">encrypted</div>
    </div>

    <!-- Device B -->
    <section class="panel" id="panel-b">
      <div class="panel-header">
        <div class="panel-header-left">
          <div class="device-badge badge-b" id="badge-b">Device B</div>
          <select class="device-select"
                  onchange="updateDeviceLabel('b', this.options[this.selectedIndex].text)">
            <option>💻 Laptop</option>
            <option selected>📱 Phone</option>
            <option>📊 Tablet</option>
            <option>⌚ Watch</option>
          </select>
        </div>
        <div class="panel-status" id="status-b">Connecting…</div>
      </div>

      <div class="feed" id="feed-b"></div>
    </section>

  </main>

  <!-- Banner (hidden until fired) -->
  <div class="paired-banner" id="paired-banner">
    <span class="banner-icon" id="banner-icon">✅</span>
    <div class="banner-text">
      <strong id="banner-title">Devices Paired</strong>
      <span id="banner-sub"></span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
